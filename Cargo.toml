[package]
name = "blob-wrangler"
homepage = "https://github.com/samcday/blob-wrangler"
repository = "https://github.com/samcday/blob-wrangler"
description = "Extract firmware from Android vendor partitions"
authors = [ "Sam Day <me@samcday.com>" ]
version = "0.0.2"
license = "MIT AND BSD-3-Clause"
edition = "2024"
include = [
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE",
    "LICENSE.BSD-3-Clause",
    "CHANGELOG.md",
    "README.md",
    "blob-wrangler.service",
    "configs/*.toml",
    "configs/README.md",
    "src/**/*.rs",
]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:pretty_env_logger", "dep:serde_json"]

[[bin]]
name = "blob-wrangler"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.0", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
toml = "0.9"
goblin = "0.9"
nix = { version = "0.31", default-features = false, features = ["mount"] }
fs_extra = "1"
pretty_env_logger = { version = "0.5", optional = true }
log = "0.4"

[dev-dependencies]
serde_json = "1.0"
