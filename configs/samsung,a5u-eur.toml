# Samsung Galaxy A5 (2015), MSM8916.
#
# The device tree carries no firmware-name, so the kernel requests the driver
# defaults: wcnss.mdt for the Wi-Fi/Bluetooth remoteproc,
# wlan/prima/WCNSS_qcom_wlan_nv.bin for wcnss_ctrl and wcn36xx, mba.mbn and
# modem.mdt for the modem, and qcom/venus-1.8/venus.mbn for the video codec.
# The Samsung-signed images live on the FAT apnhlos (NON-HLOS) and modem
# partitions; the split wcnss and modem sets are squashed but keep their .mdt
# name so the kernel finds them without a firmware-name.
[wrangler]
firmware = [
    { partition = "apnhlos", origin = "image", destination = "", files = [
            { name = "wcnss.mdt", keep_extension = true },
        ] },
    { partition = "apnhlos", origin = "image", destination = "qcom/venus-1.8", files = [
            { name = "venus.mdt" },
        ] },
    { partition = "modem", origin = "image", destination = "", files = [
            { name = "mba.mbn" },
            { name = "modem.mdt", keep_extension = true },
        ] },
    # Android keeps the WCNSS NV table on the system partition (LineageOS
    # path; the stock location is still to be confirmed on a device). Without
    # it wcnss_ctrl never creates the Wi-Fi and Bluetooth devices, so an
    # install that overwrites system has to provide wlan/prima another way.
    { partition = "system", origin = "etc/firmware/wlan/prima", destination = "wlan/prima", files = [
            { name = "WCNSS_qcom_wlan_nv.bin" },
        ] },
]
