dynamic-partition: super

extract:
  - partition: vendor
    from: firmware
    to: qcom/sdm845/axolotl
    files:
      - a630_zap.mdt
      - ipa_fws.mdt

  - partition: modem
    from: image
    to: qcom/sdm845/axolotl
    files:
      - adsp.mdt
      - adspr.jsn
      - adspua.jsn
      - cdsp.mdt
      - cdspr.jsn
      - mba.mbn
      - modem.mdt
      - modemr.jsn
      - modemuw.jsn
      - slpi.mdt
      - slpir.jsn
      - slpius.jsn
      - venus.mdt
      - wlanmdsp.mbn

  - partition: bluetooth
    from: image
    to: qca/axolotl
    files:
      - crnv21.bin

  - partition: bluetooth
    from: image
    to: qca
    files:
      - crbtfw21.tlv

  - partition: vendor
    to: /var/lib/blob-wrangler/sensors
    dirs:
      - { from: etc/acdbdata, to: acdb }
      - etc/sensors

  - partition: dsp
    to: /var/lib/blob-wrangler/sensors/dsp
    dirs: [adsp, cdsp, sdsp]

  - partition: persist
    to: /var/lib/blob-wrangler/sensors
    dirs:
      - sensors
